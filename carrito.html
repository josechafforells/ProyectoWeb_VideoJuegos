<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Games | Carrito de Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .carrito-contenedor {
            max-width: 900px;
            margin: 40px auto;
            padding: 25px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(98, 230, 167, 0.25);
            border-radius: 12px;
        }
        .carrito-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .carrito-item img {
            width: 80px;
            height: 55px;
            object-fit: cover;
            border-radius: 8px;
        }
        .carrito-info {
            flex: 1;
        }
        .carrito-resumen {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .btn-quitar {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="header-container">
            <img src="assets/img/logo.svg" alt="Logo Nexus Games" class="logo">
            <nav class="navbar">
                <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="index.html#juegos"><i class="fa-solid fa-gamepad"></i> Catálogo</a>
            </nav>
            <div class="user-actions">
                <a href="carrito.html" class="btn btn-secondary"><i class="fa-solid fa-cart-shopping"></i> Carrito (<span id="contadorCarrito">0</span>)</a>
                <a href="login.html" class="btn btn-secondary"><i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="carrito-contenedor">
            <h2 class="section-title"><i class="fa-solid fa-cart-shopping"></i> Tu Carrito de Compras</h2>
            <div id="listaCarrito"></div>

            <div class="carrito-resumen">
                <h3>Total a pagar: <span id="totalCarrito">S/ 0.00</span></h3>
                <div>
                    <button id="btnVaciar" class="btn btn-secondary" type="button">Vaciar Carrito</button>
                    <button id="btnFinalizar" class="btn btn-primary" type="button">Finalizar Compra</button>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/jscript/carrito.js"></script>
</body>

</html>
